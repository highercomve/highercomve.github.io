			<h2>Professional Summary</h2>
			<p>
				Senior software engineer with 18 years turning complex distributed
				systems into reliable products, from Linux edge devices to Kubernetes
				clouds. Top individual contributor to Pantacor's open-source
				over-the-air update platform, used in production by large manufacturers
				whose engineering teams he works with directly.
			</p>
			<p>
				Architected and built Pantacor's remote build platform (builder,
				runners, API and MCP server) so AI assistants can take an app from
				source code to a signed image running on a device. Looking to bring that
				to teams building AI infrastructure and workflow automation.
			</p>

			<h2>Highlights</h2>
			<ul>
				<li>Build platform, from the ground up: builder service, runners, API and MCP tools producing signed, multi-arch device images.</li>
				<li>AI workflow automation: MCP server with 34 tools and its own OAuth 2.1 authorization server, plus an Agent Skill.</li>
				<li>15,000+ devices: one customer fleet runs on Pantacor Fleet, architected and built almost single-handedly since 2020.</li>
				<li>2,500+ commits across the Pantacor platform since 2019: API, Fleet, web UI, CLI and hosted infrastructure.</li>
				<li>Security architecture: passkeys and 2FA, OAuth 2.1 / SSO, TLS device onboarding, certificate revocation, device secret rotation.</li>
				<li>Enterprise customers: technical partner to the engineering teams of large manufacturers.</li>
			</ul>

			<h2>Core Competencies</h2>
			<p>
				Distributed Systems &amp; Edge Compute; Cloud Architecture &amp;
				Orchestration; Solution Architecture &amp; Customer Integration; MCP
				Servers &amp; AI Agent Tooling; Workflow Automation &amp; CI/CD Pipelines;
				Frontend &amp; Backend Engineering; DevOps &amp; Continuous Integration;
				Technical Leadership &amp; Mentorship.
			</p>

			<h2>Technical Skills</h2>
			<p>
				Golang, Model Context Protocol (MCP), Agent Skills, AI coding agents
				(Claude Code, Codex), Docker, Kubernetes, Helm, Amazon Web Services (AWS),
				Google Cloud, AWS Lambda, Microservices, REST APIs, CI/CD, Linux, Linux
				containers, Yocto / Embedded Linux, Bash, Zig, JavaScript, TypeScript,
				Node.js, React, React Native, Vue.js, Web Components, Ruby, Ruby on Rails,
				PHP, PostgreSQL, MongoDB, MySQL, Nginx, HTML / CSS, Webpack / Vite /
				Rollup, TDD, Git.
			</p>

			<h2>Professional Experience</h2>
			<h3>Senior Software Engineer — Pantacor</h3>
			<p>March 2019 – Present · pantacor.com</p>
			<ul>
				<li>Architected and built the remote build platform from the ground up: builder service, distributed runners, API and MCP tools (Go, MongoDB, Docker BuildKit); Dockerfile, Yocto and Buildroot builds into signed, multi-arch packages and flashable images.</li>
				<li>Built the Pantacor Hub MCP server (34 tools) with an OAuth 2.1 authorization server, plus the pantavisor-apps Agent Skill for AI-driven build and deploy with human approval.</li>
				<li>Architected and built Pantacor Fleet and its CLI almost single-handedly since 2020 (930+ commits): Go/React, SpiceDB, OPA; one customer fleet runs 15,000+ Linux devices.</li>
				<li>Top individual contributor to the Pantahub core API and owner of its security architecture: 2FA and passkeys, OAuth/PKCE and Entra ID SSO, TLS onboarding, certificate revocation, device secret rotation; plus MQTT push OTA, remote commands, live logs and web SSH.</li>
				<li>Lead the hosted platform's cloud infrastructure on Kubernetes (Helm, Kafka, monitoring, backups) and built its event-driven webhooks service.</li>
				<li>Partner with the engineering teams of large enterprise manufacturers on OTA and fleet-management solutions.</li>
				<li>Core maintainer of the React web dashboard, pvr, pvflasher, pantavisor-mocker (Zig) and container-ci (used by 12+ projects).</li>
			</ul>
